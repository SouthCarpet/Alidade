name: CI

# Runs on a machine that knows nothing about any developer's disk. That is the
# whole point: the first run on this repository failed because the app depended
# on paths outside it, which no local check could have caught.
#
#   - push to main: the shared branch, verified from a clean checkout
#   - release tags: nothing ships without a clean build
#   - pull requests: code that has never run here
#   - on demand: gh workflow run ci.yml --repo SouthCarpet/Alidade
#
# Feature branches are left out on purpose — work in progress does not need a
# verdict on every save, and main plus PRs already cover what matters.
on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache Cargo registry and build output
        uses: actions/cache@v4
        with:
          path: |
            ~\.cargo\registry
            ~\.cargo\git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - run: cargo build --workspace
      - run: cargo test --workspace
      - run: cargo clippy --workspace --all-targets -- -D warnings
