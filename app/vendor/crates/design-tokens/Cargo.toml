[package]
name = "design-tokens"
# Bump on every src/schema.rs change (item I): the vendored copy's version
# is the only way a standalone consumer (Alidade) states which schema it
# carries. See design/README.md, "Version". 0.2.0: accepted_hue_overlaps
# added to AppTokens (plan 094 Task 3, item D). 0.3.0: overrides added to
# AppTokens (plan 098, item C1). 0.4.0: direction A (plan 094 revision 2):
# neutral_tint optional, dataviz.ramp replaces the anchor rule (series_order
# removed), accent_family.selected, soft_active.l_delta, type.body, neutrals
# surface-hover/border-strong/control added and border-top/milled removed,
# tracking, motion.stagger_step/press and the shadow geometry removed.
# 0.5.0: the motion layer (plan 094 revision 2, lane K2): motion.slow,
# ease_loop, offset_press, offset_enter, offset_focus and scale_enter added.
# 0.6.0: the control set (lane K4, spec R9): motion.scale_mark added.
# 0.7.0: the gap controls (lane K5): motion.tooltip_delay added.
# 0.8.0: the register motion set (lane K6, spec R17 and R18): motion.ink_hold
# and motion.ink_cap_per_second added, and the `motion` module (iced feature).
# 0.9.0: the `keys` module (iced feature, lane K9): keyboard rules.
# 0.10.0: Kaliber r4 (plan 125): neutrals surface-active and disabled-text,
# accent_family.ink, space 12, type read/display steps, motion sequence_*,
# AppTokens.accent2_hue with the Accent2 tones, the `contrast` module and
# CLI subcommand, and the `fonts` module (iced feature, Fira Sans).
version = "0.10.0"
edition = "2021"
build = "build.rs"

# No runtime dependencies: everything the crate exposes (Theme consts, scale
# consts) is computed once at build time and baked into plain Rust literals.
# The iced conversion (Task 4) will add its dependency behind a feature flag.

[build-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# schema.rs (the deny_unknown_fields structs + parse helpers) is shared
# between build.rs (include!, via [build-dependencies] above) and a
# #[cfg(test)]-only module in src/lib.rs, which is what makes the Step 5
# negative-build-check test ("does the schema gate actually reject an
# invalid file?") runnable under `cargo test`. Same serde, dev-only here so
# the shipped library keeps zero runtime dependencies.
[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dependencies]
# `iced_core` (not the full `iced` facade crate) so the `iced` feature stays
# light: it only needs `iced_core::Color`, not the wgpu/tiny-skia renderer
# stack that gallery-iced pulls in separately. Same published version as
# gallery-iced's `iced` (0.14.0) — `iced::Color` is a direct re-export of
# `iced_core::Color`, so `From<Rgba> for iced_core::Color` satisfies
# `From<Rgba> for iced::Color` for any consumer on the same iced 0.14 line.
iced_core = { version = "0.14.0", optional = true, default-features = false }
# `iced_widget` (plan 094 Task 11, item J): `styles.rs` builds real
# `button::Style`/`container::Style`/`text_input::Style` values, and those
# types live in `iced_widget`, not `iced_core`. Any real iced consumer of
# this feature (gallery-iced, Alidade) already depends on the full `iced`
# facade, which re-exports `iced_widget`'s renderer backend anyway, so this
# adds no new backend to the dependency graph, only the one already
# required -- Cargo unifies both to the same 0.14.2 resolution inside this
# workspace. `iced::widget::button::Style` is a direct re-export of
# `iced_widget::button::Style`, so values built here satisfy the facade's
# type on the same iced 0.14 line.
iced_widget = { version = "0.14.0", optional = true, default-features = false }

[features]
iced = ["dep:iced_core", "dep:iced_widget"]

# Marker block name: cargo-toml-clippy-allow (design/consumers.json's
# "marker_file" field for this app names this exact file; test_vendor.py
# checks it with a prefix match instead of byte equality because of this
# block).
# The lines below are this vendored copy's one addition on top of the source
# crate (`A:\projects-vault\design\crates\design-tokens\Cargo.toml`, not part
# of this repo — see ../../README.md). This crate was never linted by this
# repo's CI before it was vendored (it lived outside the Cargo workspace);
# vendoring it inside app/ makes `cargo clippy --workspace --all-targets --
# -D warnings` see it for the first time, surfacing two lints its own
# (separately linted) source repo does not gate on: build.rs's generated-code
# writer uses `write!(..., "...\n", ...)` throughout rather than `writeln!`
# (literal trailing newlines, matching the exact rendered Rust/CSS output),
# and the OKLCH->sRGB conversion in build.rs bakes 9-decimal-digit f32
# literals into the generated Theme consts (deliberate — see color.rs's
# `rust_lit`). Rewriting either would diverge this copy from its source
# line-for-line, which is the opposite of what vendoring the crate whole is
# for, so this allows exactly those two lints in this one package instead.
# Re-add this block after every `vendor-sync.ps1` refresh; the sync script's
# plain file diff will flag its absence as drift.
[lints.clippy]
write_with_newline = "allow"
excessive_precision = "allow"
