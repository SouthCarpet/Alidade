[package]
name = "design-tokens"
version = "0.1.0"
edition = "2021"
build = "build.rs"

# No runtime dependencies: everything the crate exposes (Theme consts, scale
# consts) is computed once at build time and baked into plain Rust literals.
# The iced conversion (Task 4) will add its dependency behind a feature flag.

[build-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# schema.rs (the deny_unknown_fields structs + parse helpers) is shared
# between build.rs (include!, via [build-dependencies] above) and a
# #[cfg(test)]-only module in src/lib.rs, which is what makes the Step 5
# negative-build-check test ("does the schema gate actually reject an
# invalid file?") runnable under `cargo test`. Same serde, dev-only here so
# the shipped library keeps zero runtime dependencies.
[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dependencies]
# `iced_core` (not the full `iced` facade crate) so the `iced` feature stays
# light: it only needs `iced_core::Color`, not the wgpu/tiny-skia renderer
# stack that gallery-iced pulls in separately. Same published version as
# gallery-iced's `iced` (0.14.0) — `iced::Color` is a direct re-export of
# `iced_core::Color`, so `From<Rgba> for iced_core::Color` satisfies
# `From<Rgba> for iced::Color` for any consumer on the same iced 0.14 line.
iced_core = { version = "0.14.0", optional = true, default-features = false }

[features]
iced = ["dep:iced_core"]

# The lines below are this vendored copy's one addition on top of the source
# crate (`A:\projects-vault\design\crates\design-tokens\Cargo.toml`, not part
# of this repo — see ../../README.md). This crate was never linted by this
# repo's CI before it was vendored (it lived outside the Cargo workspace);
# vendoring it inside app/ makes `cargo clippy --workspace --all-targets --
# -D warnings` see it for the first time, surfacing two lints its own
# (separately linted) source repo does not gate on: build.rs's generated-code
# writer uses `write!(..., "...\n", ...)` throughout rather than `writeln!`
# (literal trailing newlines, matching the exact rendered Rust/CSS output),
# and the OKLCH->sRGB conversion in build.rs bakes 9-decimal-digit f32
# literals into the generated Theme consts (deliberate — see color.rs's
# `rust_lit`). Rewriting either would diverge this copy from its source
# line-for-line, which is the opposite of what vendoring the crate whole is
# for, so this allows exactly those two lints in this one package instead.
# Re-add this block after every `vendor-sync.ps1` refresh; the sync script's
# plain file diff will flag its absence as drift.
[lints.clippy]
write_with_newline = "allow"
excessive_precision = "allow"
