[package]
name = "alidade-app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
iced = { version = "0.14.0", features = ["canvas", "tokio"] }
design-tokens = { path = "vendor/crates/design-tokens", features = ["iced"] }
alidade-engine = { path = "../engine" }
alidade-store = { path = "../store" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }

# For the opt-in update check. Versions match what the workspace lockfile
# already resolved for the engine, so this adds no new transitive tree.
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "json"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2.0.20"

# Tray icon, close-to-tray, threshold notifications (plan 052, Task 6):
# Windows-only, same target-gating pattern as the engine's ICMP `windows`
# dependency, so the app still compiles elsewhere with the feature stubbed.
[target.'cfg(windows)'.dependencies]
tray-icon = "0.23"    # tray icon + Show/Run/Pause/Quit menu
notify-rust = "4"     # Windows toast for threshold breaches
