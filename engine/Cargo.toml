[package]
name = "alidade-engine"
version = "0.1.0"
edition = "2021"

[dependencies]
async-trait = "0.1.92"
futures-core = "0.3.34"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "stream"] }
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time"] }

[dev-dependencies]
wiremock = "0.6.5"
